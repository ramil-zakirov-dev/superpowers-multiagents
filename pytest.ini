[pytest]
testpaths = tests
# The default basetemp lives under the user's Temp directory, which on some
# Windows setups denies scandir (WinError 5) and errors every tmp_path test
# before it runs — 156 of them here, none of them real. Keeping scratch inside
# the repo makes the suite depend on nothing but the checkout. `.pytest-tmp/`
# is already gitignored.
addopts = --basetemp=.pytest-tmp
